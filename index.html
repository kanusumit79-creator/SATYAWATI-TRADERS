      // Ensure window.fetch is configurable and writable so environment/extension proxies do not throw getter errors
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                value: originalFetch,
                writable: true,
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              var _currFetch = originalFetch;
              Object.defineProperty(window, 'fetch', {
                get: function() { return _currFetch; },
                set: function(v) { _currFetch = v; },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {}

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (desc && !desc.set && !desc.writable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: desc.get || function() { return window.fetch; },
                set: function(fn) {
                  try {
                    Object.defineProperty(this, 'fetch', {
                      value: fn,
                      writable: true,
                      configurable: true,
                      enumerable: true
                    });
                  } catch (err) {
                    this._customFetch = fn;
                  }
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e2) {}
      })();
